name: online-speaker-diarization

# Streaming speaker diarization with Nemotron-3-Diarization, on top of the
# offline Sortformer support from #4032: export the model, build the static
# libraries the Rust crate links, and check the streaming results against
# the offline ones.
#
# A tag boardcast-* also publishes them as a release of this fork, which
# boardcast's builds download through SHERPA_ONNX_RELEASE_URL, so its own
# releases do not build sherpa-onnx.

on:
  workflow_dispatch:
  push:
    branches:
      - online-speaker-diarization
    tags:
      - 'boardcast-*'

permissions:
  contents: read

concurrency:
  group: online-speaker-diarization-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    name: export Nemotron-3-Diarization
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        run: |
          pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r scripts/nemo/nemotron-3-diarization/requirements.txt

      - name: Export
        shell: bash
        run: |
          d=sherpa-onnx-nemotron-3-diarization
          src="$PWD/$d"
          mkdir -p "$src/test_wavs"
          pushd scripts/nemo/nemotron-3-diarization
          ./run.sh
          cp ./*.onnx "$src/"
          cp ./0-four-speakers-zh.wav "$src/test_wavs/"
          popd
          curl -fSL https://raw.githubusercontent.com/OpenMDW/OpenMDW/b26b32b34ad2edcc29a7707abb68dcfb25a538c1/1.1/LICENSE.OpenMDW-1.1 -o "$src/LICENSE"
          curl -fSL https://huggingface.co/nvidia/Nemotron-3-Diarization/resolve/f667ed73aee57d40cc39428eb768b4fd87a0a29e/README.md -o "$src/MODEL_CARD.md"
          ls -lh "$src"

      - uses: actions/upload-artifact@v4
        with:
          name: sherpa-onnx-nemotron-3-diarization
          path: sherpa-onnx-nemotron-3-diarization

  build:
    name: static libs ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # The images boardcast's release builds on, so the libraries link there:
        # the same MSVC and both kinds of Mac. Linux builds in manylinux2014
        # (glibc 2.17) below, and also gives the command-line tools for the test.
        include:
          - os: ubuntu-22.04
            archive: linux-x64-static-lib
          - os: macos-15
            archive: osx-arm64-static-lib
          - os: macos-15-intel
            archive: osx-x64-static-lib
          - os: windows-2022
            archive: win-x64-static-MT-Release-lib
    steps:
      - uses: actions/checkout@v4

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.os }}-online-speaker-diarization

      - name: Set up MSVC
        if: startsWith(matrix.os, 'windows')
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Linux is built the way upstream builds its releases: in manylinux2014
      # with devtoolset-11, whose libstdc++ uses the old std::string ABI like
      # the prebuilt static ONNX Runtime. Built natively on Ubuntu, the two
      # ABIs meet in std::regex and the app aborts with "free(): invalid
      # pointer" as soon as ONNX Runtime starts.
      - name: Build in manylinux2014
        if: startsWith(matrix.os, 'ubuntu')
        shell: bash
        run: |
          docker run --rm \
            --volume "$PWD":/work \
            quay.io/pypa/manylinux2014_x86_64 \
            bash -c '
              set -ex
              echo "multilib_policy=best" >> /etc/yum.conf
              echo "skip_missing_names_on_install=False" >> /etc/yum.conf
              sed -i "/^override_install_langs=/d" /etc/yum.conf
              yum -y install yum-utils
              yum-config-manager --enable extras
              yum -y install centos-release-scl-rh
              yum -y install devtoolset-11-binutils devtoolset-11-gcc devtoolset-11-gcc-c++
              source /opt/rh/devtoolset-11/enable
              gcc --version
              cd /work
              mkdir build
              cd build
              cmake -D CMAKE_BUILD_TYPE=Release -D BUILD_SHARED_LIBS=OFF \
                -D SHERPA_ONNX_ENABLE_PORTAUDIO=OFF -D SHERPA_ONNX_ENABLE_WEBSOCKET=OFF \
                -D SHERPA_ONNX_ENABLE_SPEAKER_DIARIZATION=ON -D SHERPA_ONNX_ENABLE_BINARY=ON \
                -D CMAKE_INSTALL_PREFIX=./install ..
              make -j4
              make install
            '
          sudo chown -R "$(id -u):$(id -g)" build
          ls -lh build/install/lib
          echo "new-ABI symbols (must be 0): $(nm -C build/install/lib/libsherpa-onnx-core.a | grep -c __cxx11 || true)"
          test "$(nm -C build/install/lib/libsherpa-onnx-core.a | grep -c __cxx11 || true)" = 0

      - name: Configure
        if: ${{ !startsWith(matrix.os, 'ubuntu') }}
        shell: bash
        run: |
          export CMAKE_CXX_COMPILER_LAUNCHER=ccache
          export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
          mkdir build
          cd build
          common="-D BUILD_SHARED_LIBS=OFF -D SHERPA_ONNX_ENABLE_PORTAUDIO=OFF -D SHERPA_ONNX_ENABLE_WEBSOCKET=OFF -D SHERPA_ONNX_ENABLE_SPEAKER_DIARIZATION=ON -D CMAKE_INSTALL_PREFIX=./install"
          if [[ "${{ matrix.os }}" == windows-* ]]; then
            cmake -A x64 -D SHERPA_ONNX_ENABLE_BINARY=OFF -D SHERPA_ONNX_USE_STATIC_CRT=ON $common ..
          else
            cmake -D CMAKE_BUILD_TYPE=Release -D SHERPA_ONNX_ENABLE_BINARY=OFF $common ..
          fi

      - name: Build
        if: ${{ !startsWith(matrix.os, 'ubuntu') }}
        shell: bash
        run: |
          export CMAKE_CXX_COMPILER_LAUNCHER=ccache
          export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
          cd build
          if [[ "${{ matrix.os }}" == windows-* ]]; then
            cmake --build . --config Release -- -m:2
            cmake --build . --config Release --target install -- -m:2
          else
            make -j4
            make install
          fi
          ls -lh install/lib

      - name: Package for the Rust crate
        shell: bash
        run: |
          v=$(grep "SHERPA_ONNX_VERSION" ./CMakeLists.txt | cut -d " " -f 2 | cut -d "\"" -f 2)
          d=sherpa-onnx-v$v-${{ matrix.archive }}
          mkdir -p "$d"
          cp -r build/install/lib "$d/"
          tar cjf "$d.tar.bz2" "$d"
          ls -lh "$d.tar.bz2"
          du -sh "$d/lib"

      - uses: actions/upload-artifact@v4
        with:
          name: static-lib-${{ matrix.archive }}
          path: sherpa-onnx-v*-${{ matrix.archive }}.tar.bz2

      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-22.04'
        with:
          name: linux-tools
          path: |
            build/bin/sherpa-onnx-online-speaker-diarization
            build/bin/sherpa-onnx-offline-speaker-diarization

  test:
    name: streaming against offline
    needs: [export, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sherpa-onnx-nemotron-3-diarization
          path: model

      - uses: actions/download-artifact@v4
        with:
          name: linux-tools
          path: bin

      - name: Compare
        shell: bash
        run: |
          chmod +x bin/*
          wav=model/test_wavs/0-four-speakers-zh.wav
          for m in model.onnx model.int8.onnx; do
            echo "== $m, offline geometry: must equal the offline result"
            ./bin/sherpa-onnx-online-speaker-diarization --sortformer-model=model/$m --compare-offline=1 $wav
            for cl in "9 4" "6 2" "3 1"; do
              set -- $cl
              echo "== $m, chunk $1, right context $2"
              ./bin/sherpa-onnx-online-speaker-diarization --sortformer-model=model/$m \
                --chunk-length=$1 --chunk-right-context=$2 --compare-offline=1 $wav
            done
          done

  release:
    name: publish the release
    if: startsWith(github.ref, 'refs/tags/boardcast-')
    needs: [export, build, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir release
          cp artifacts/static-lib-*/*.tar.bz2 release/
          tar cjf release/sherpa-onnx-nemotron-3-diarization.tar.bz2 \
            -C artifacts sherpa-onnx-nemotron-3-diarization
          (cd release && sha256sum *.tar.bz2 > SHA256SUMS)
          ls -lh release
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes "Static libraries for the Rust crate (Linux x64, macOS arm64 and x64, Windows x64) and Nemotron-3-Diarization (FP32 and INT8, OpenMDW-1.1), built from ${GITHUB_SHA::8}. Set SHERPA_ONNX_RELEASE_URL=https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME to build against them."
